<title>Kopasz Portfolio Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Courier+Prime:wght@400;700&family=EB+Garamond:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Libre+Caslon+Text:wght@400;700&family=Libre+Franklin:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: an edge-to-edge wall of equal square tiles in a deliberate order,
   ending in the colour field. About is a quiet text block at the end of the
   wall, aligned to the wall's own columns, like a colophon on the last page
   of a book. No entry to it, no circle. The only shapes are the triangles
   that move through a series, and they stay hidden until the pointer goes
   looking for them. Nothing fades, nothing animates. */
:root {
  color-scheme: dark;
  --field: #2a1fa8;
  --mark: color-mix(in oklab, var(--field), white 24%);
  --ink: #eceaf6;
  --ink-quiet: color-mix(in oklab, var(--ink), var(--field) 35%);
  --tile-wait: color-mix(in oklab, var(--field), black 30%);
  --cols: 4;
  --pad: clamp(14px, 3.5vmin, 44px);
  --zone: clamp(84px, 17vw, 300px);
  --zone-v: 22dvh;
  --text: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;     /* prototype panel only */
}
html, body { background: var(--field); }
body { color: var(--ink); font-family: var(--text); overflow-x: hidden; }

/* ---------- the wall ---------- */
.wall { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.tile {
  all: unset; display: block; position: relative;
  aspect-ratio: 1 / 1; max-width: 100%;
  background: var(--tile-wait); overflow: hidden; cursor: default;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile img:not([src]) { visibility: hidden; }
.tile:focus-visible { outline: 3px solid var(--mark); outline-offset: -3px; z-index: 1; }
.tile--pause, .tile--fill { background: var(--field); pointer-events: none; }

/* ---------- viewer ---------- */
.viewer {
  position: fixed; inset: 0; z-index: 20;
  background: var(--field);
  display: grid; place-items: center;
  cursor: default;
}
.viewer:focus { outline: none; }
.viewer img {
  display: block;
  max-width: calc(100vw - 2 * var(--pad));
  max-height: calc(100dvh - 2 * var(--pad));
  object-fit: contain;
  user-select: none; -webkit-user-drag: none;
}
.viewer.is-series img { max-width: calc(100vw - 2 * var(--zone)); }
.tri {
  all: unset; position: absolute;
  top: 0; bottom: 0; width: var(--zone);
  display: none; cursor: default;
}
.viewer.is-series .tri { display: block; }
.tri--prev { left: 0; }
.tri--next { right: 0; }
.tri svg { position: absolute; inset: var(--pad) calc(var(--pad) * .75); width: calc(100% - 1.5 * var(--pad)); height: calc(100% - 2 * var(--pad)); display: block; }
.tri polygon { fill: var(--mark); }
/* desktop: the triangle exists only while the pointer is in its zone */
@media (hover: hover) and (pointer: fine) {
  body.tri-hover .tri polygon { fill: transparent; }
  body.tri-hover .tri:hover polygon, body.tri-hover .tri:focus-visible polygon { fill: var(--mark); }
}
@media (orientation: portrait) {
  .viewer img, .viewer.is-series img { max-width: 100vw; }
  .viewer.is-series img { max-height: calc(100dvh - var(--zone-v) - var(--pad)); margin-bottom: var(--zone-v); }
  .tri { top: auto; bottom: 0; height: var(--zone-v); width: 50vw; }
}

/* ---------- about: the end of the wall ---------- */
.about {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  align-items: end;
  padding-block: calc(var(--pad) * 3);
}
.about__text {
  grid-column: 2 / span 2;
  padding-inline: var(--pad);
  max-width: 38em;
  font-size: clamp(.95rem, 1.05vw, 1.1rem);
  line-height: 1.6;
}
.about__name { font: inherit; font-weight: 600; margin: 0 0 2.4em; letter-spacing: .02em; }
.about p { margin: 0 0 1.2em; text-wrap: pretty; }
.about .quiet { color: var(--ink-quiet); }
.about .contact { margin-top: 2.4em; user-select: all; }
.lang { display: flex; gap: 1.2em; margin-top: 3em; }
.lang button {
  all: unset; cursor: default;
  font: inherit; font-size: .85em; letter-spacing: .12em;
  color: var(--ink-quiet);
}
.lang button[aria-pressed="true"] { color: var(--ink); }
.lang button:focus-visible { outline: 1px solid var(--mark); outline-offset: 4px; }
@media (max-width: 999px) { .about__text { grid-column: 1 / -1; padding-inline: max(var(--pad), env(safe-area-inset-left, 0px)) max(var(--pad), env(safe-area-inset-right, 0px)); } }
@media (min-width: 1000px) and (max-width: 1399px) { .about__text { grid-column: 2 / span 3; } }

/* ---------- prototype controls (not part of the site) ---------- */
.proto {
  position: fixed; z-index: 40;
  right: calc(12px + env(safe-area-inset-right, 0px));
  top: calc(12px + env(safe-area-inset-top, 0px));
  font: 500 12px/1.3 var(--ui); color: #111;
  display: flex; flex-direction: column; align-items: flex-end;
}
.proto__toggle {
  all: unset; cursor: pointer; background: #fff; color: #111;
  padding: 8px 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; font-size: 11px;
  box-shadow: 0 4px 18px rgb(0 0 0 / .35);
}
.proto__toggle:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
.proto__panel {
  background: #fff; padding: 14px; margin-top: 8px; width: min(300px, calc(100vw - 24px));
  display: grid; gap: 14px; box-shadow: 0 8px 30px rgb(0 0 0 / .4);
  max-height: calc(100dvh - 80px); overflow-y: auto;
}
.proto__panel p { margin: 0; color: #555; }
.proto fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.proto legend { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; color: #444; margin-bottom: 4px; }
.proto .opts { display: flex; flex-wrap: wrap; gap: 4px; }
.proto .opts button { all: unset; cursor: pointer; padding: 5px 8px; border: 1px solid #ccc; color: #111; }
.proto .opts button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
.proto .opts button:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
.swatch { width: 10px; height: 10px; display: inline-block; vertical-align: -1px; margin-right: 5px; }
.picker { display: flex; gap: 6px; align-items: stretch; }
.picker input[type="color"] { width: 44px; height: 34px; padding: 0; border: 1px solid #ccc; background: none; cursor: pointer; }
.picker input[type="text"] {
  flex: 1; min-width: 0; font: 600 13px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em;
  padding: 0 8px; border: 1px solid #ccc; color: #111; background: #fff; text-transform: lowercase;
}
.picker button { all: unset; cursor: pointer; padding: 0 10px; border: 1px solid #111; font-weight: 600; display: flex; align-items: center; }
.picker input:focus-visible, .picker button:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
.proto input[type="range"] { width: 100%; accent-color: #111; }
.tone-preview { height: 34px; background: var(--field); display: flex; align-items: center; padding-left: 10px; }
.tone-preview span { width: 0; height: 0; border-style: solid; border-width: 10px 0 10px 18px; border-color: transparent transparent transparent var(--mark); }
</style>

<main>
  <div class="wall" id="wall" aria-label="Photographs"></div>

  <section class="about" id="about" aria-labelledby="aboutName">
    <div class="about__text">
      <h1 class="about__name" id="aboutName">Kopasz Márton</h1>
      <p id="aboutStatement"></p>
      <p class="quiet" id="aboutBio"></p>
      <p class="quiet contact" id="aboutContact"></p>
      <div class="lang" role="group" aria-label="Language">
        <button id="langEn" aria-pressed="true" lang="en">EN</button>
        <button id="langHu" aria-pressed="false" lang="hu">HU</button>
      </div>
    </div>
  </section>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photograph" tabindex="-1">
  <img id="viewerImg" alt="">
  <button class="tri tri--prev" id="prev" aria-label="Previous photograph in series">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="100,0 100,100 0,50"/></svg>
  </button>
  <button class="tri tri--next" id="next" aria-label="Next photograph in series">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 0,100 100,50"/></svg>
  </button>
</div>

<div class="proto" id="proto">
  <button class="proto__toggle" id="protoToggle" aria-expanded="false" aria-controls="protoPanel">Prototype</button>
  <div class="proto__panel" id="protoPanel" hidden>
    <p>Prototype controls, not part of the site. Placeholder images are generated; your photographs replace them.</p>
    <fieldset>
      <legend>Field colour</legend>
      <div class="picker">
        <input type="color" id="fieldPicker" aria-label="Pick the field colour">
        <input type="text" id="fieldHex" spellcheck="false" autocomplete="off" maxlength="7" aria-label="Field colour as hex code">
        <button type="button" id="fieldCopy">Copy</button>
      </div>
      <div class="opts" data-key="field"></div>
    </fieldset>
    <fieldset>
      <legend>Mark tone <span id="toneOut"></span></legend>
      <input type="range" id="tone" min="6" max="50" step="1" aria-label="How much lighter the triangles are than the field">
      <div class="tone-preview" aria-hidden="true"><span></span></div>
    </fieldset>
    <fieldset><legend>Typeface (About text)</legend><div class="opts" data-key="font"></div></fieldset>
    <fieldset><legend>Series on the wall</legend><div class="opts" data-key="series"></div></fieldset>
    <fieldset><legend>Triangles (desktop)</legend><div class="opts" data-key="tri"></div></fieldset>
    <fieldset><legend>Phone columns</legend><div class="opts" data-key="phone"></div></fieldset>
  </div>
</div>

<script>
(() => {
  /* ---------- prototype options ---------- */
  const OPTIONS = {
    field: [["Indigo", "#2a1fa8"], ["Deep indigo", "#1d1580"], ["Night indigo", "#170f63"], ["Ink", "#120c45"], ["Prussian", "#0d1d4f"], ["Klein", "#002fa7"]],
    font: [
      ["Caslon · museum label", "\"Libre Caslon Text\", Georgia, serif"],
      ["Garamond · old book", "\"EB Garamond\", Garamond, Georgia, serif"],
      ["Newsreader · quiet serif", "\"Newsreader\", Georgia, serif"],
      ["Franklin · classic sans", "\"Libre Franklin\", \"Helvetica Neue\", Arial, sans-serif"],
      ["Archivo · neutral sans", "\"Archivo\", \"Helvetica Neue\", Arial, sans-serif"],
      ["Courier · typewriter", "\"Courier Prime\", \"Courier New\", monospace"],
      ["Plex Mono · archive", "\"IBM Plex Mono\", Menlo, monospace"]
    ],
    series: [["One tile, opens into the series", "tile"], ["Whole series on the wall, with pauses", "run"]],
    tri: [["Appear on hover", "hover"], ["Always visible", "always"]],
    phone: [["1", "1"], ["2", "2"], ["3", "3"]]
  };
  const DEFAULTS = { phone: "2", field: "#2a1fa8", tone: 24, font: OPTIONS.font[0][1], series: "tile", tri: "hover" };
  let state = { ...DEFAULTS };
  try { Object.assign(state, JSON.parse(localStorage.getItem("proto-v4") || "{}")); } catch (e) {}

  const root = document.documentElement;
  const picker = document.getElementById("fieldPicker");
  const hex = document.getElementById("fieldHex");
  const tone = document.getElementById("tone");
  let builtSeriesMode = null;
  function applyState() {
    root.style.setProperty("--field", state.field);
    root.style.setProperty("--mark", `color-mix(in oklab, var(--field), white ${state.tone}%)`);
    root.style.setProperty("--text", state.font);
    document.body.classList.toggle("tri-hover", state.tri === "hover");
    picker.value = state.field;
    if (document.activeElement !== hex) hex.value = state.field;
    tone.value = state.tone;
    document.getElementById("toneOut").textContent = state.tone + "%";
    if (builtSeriesMode !== state.series) buildWall();
    layout();
    document.querySelectorAll(".proto .opts").forEach(g => {
      g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.value === String(state[g.dataset.key]))));
    });
    try { localStorage.setItem("proto-v4", JSON.stringify(state)); } catch (e) {}
  }
  document.querySelectorAll(".proto .opts").forEach(g => {
    OPTIONS[g.dataset.key].forEach(([label, value]) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.value = value;
      if (g.dataset.key === "field") b.innerHTML = `<span class="swatch" style="background:${value}"></span>`;
      if (g.dataset.key === "font") b.style.fontFamily = value;
      b.append(label);
      b.addEventListener("click", () => { state[g.dataset.key] = value; applyState(); });
      g.appendChild(b);
    });
  });
  picker.addEventListener("input", () => { state.field = picker.value; applyState(); });
  hex.addEventListener("input", () => {
    let v = hex.value.trim(); if (v[0] !== "#") v = "#" + v;
    if (/^#[0-9a-f]{6}$/i.test(v)) { state.field = v.toLowerCase(); applyState(); }
  });
  hex.addEventListener("blur", () => { hex.value = state.field; });
  tone.addEventListener("input", () => { state.tone = +tone.value; applyState(); });
  document.getElementById("fieldCopy").addEventListener("click", e => {
    const btn = e.currentTarget;
    const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); };
    navigator.clipboard?.writeText(state.field).then(done, () => { hex.focus(); hex.select(); });
  });
  const protoToggle = document.getElementById("protoToggle");
  const protoPanel = document.getElementById("protoPanel");
  protoToggle.addEventListener("click", () => {
    protoPanel.hidden = !protoPanel.hidden;
    protoToggle.setAttribute("aria-expanded", String(!protoPanel.hidden));
  });

  /* ---------- placeholder photographs (procedural, darker, quieter) ---------- */
  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const PALETTES = [
    ["#9fb3c2", "#e6e1d6", "#5d6b70", "#20282b"],
    ["#2b3446", "#c98f62", "#3a2e2e", "#120e10"],
    ["#7e9a8e", "#d8dccf", "#47584c", "#18211a"],
    ["#c9c3b8", "#f1ece4", "#8b8478", "#2f2b26"],
    ["#0f1b2c", "#4e6a86", "#16202a", "#05080b"],
    ["#1a1c22", "#5b5f68", "#0e0f12", "#030304"]
  ];
  const RATIOS = [3/2, 2/3, 4/5, 1, 16/9, 5/4, 3/4];
  const mix = (a, b, t) => {
    const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`;
  };
  function paint(seed) {
    const r = rng(seed * 9973 + 17);
    const ratio = RATIOS[Math.floor(r() * RATIOS.length)];
    const long = 1100;
    const w = ratio >= 1 ? long : Math.round(long * ratio);
    const h = ratio >= 1 ? Math.round(long / ratio) : long;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d");
    const pal = PALETTES[Math.floor(r() * PALETTES.length)];
    const mono = r() < 0.55;
    const sea = r() < 0.25;                       // a still horizon at the exact middle
    const horizon = sea ? h / 2 : h * (0.3 + r() * 0.45);
    let g = x.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    if (sea) {
      g = x.createLinearGradient(0, horizon, 0, h);
      g.addColorStop(0, pal[2]); g.addColorStop(1, pal[3]);
      x.fillStyle = g; x.fillRect(0, horizon, w, h - horizon);
    } else {
      if (r() < 0.3) {
        const sx = w * (0.2 + r() * 0.6), sy = horizon * (0.5 + r() * 0.4), sr = Math.min(w, h) * (0.04 + r() * 0.08);
        const sg = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
        sg.addColorStop(0, "rgba(255,248,235,.9)"); sg.addColorStop(0.25, "rgba(255,240,220,.3)"); sg.addColorStop(1, "rgba(255,240,220,0)");
        x.fillStyle = sg; x.fillRect(0, 0, w, h);
      }
      const layers = 2 + Math.floor(r() * 3);
      for (let L = 0; L < layers; L++) {
        const t = L / (layers - 1);
        const base = horizon + (h - horizon) * t * 0.55;
        const amp = h * (0.03 + r() * 0.09) * (1 - t * 0.5);
        const f1 = 1 + r() * 3, f2 = 4 + r() * 9, ph = r() * 10;
        x.beginPath(); x.moveTo(0, h);
        for (let px = 0; px <= w; px += 4) {
          const u = px / w;
          x.lineTo(px, base - amp * (0.6 * Math.sin(u * f1 * Math.PI + ph) + 0.3 * Math.sin(u * f2 * Math.PI + ph * 2) + 0.1 * Math.sin(u * 40 + L)));
        }
        x.lineTo(w, h); x.closePath();
        x.fillStyle = mix(pal[2], pal[3], t); x.fill();
      }
      const fogY = horizon + (r() - 0.5) * h * 0.1, fogH = h * (0.08 + r() * 0.2);
      g = x.createLinearGradient(0, fogY - fogH, 0, fogY + fogH);
      g.addColorStop(0, "rgba(235,235,230,0)"); g.addColorStop(0.5, `rgba(235,235,230,${0.12 + r() * 0.4})`); g.addColorStop(1, "rgba(235,235,230,0)");
      x.fillStyle = g; x.fillRect(0, 0, w, h);
    }
    const img = x.getImageData(0, 0, w, h), d = img.data, amt = 12 + r() * 18;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * amt;
      let R = d[i] + n, G = d[i + 1] + n, B = d[i + 2] + n;
      if (mono) { let l = 0.3 * R + 0.59 * G + 0.11 * B; l = 128 + (l - 128) * 1.3; R = G = B = l; }
      d[i] = R; d[i + 1] = G; d[i + 2] = B;
    }
    x.putImageData(img, 0, 0);
    const v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.5)");
    x.fillStyle = v; x.fillRect(0, 0, w, h);
    return new Promise(res => c.toBlob(b => res(URL.createObjectURL(b)), "image/jpeg", 0.86));
  }

  /* ---------- content: a deliberate order of singles and a few series ---------- */
  // In the real site this comes from one data file, in this order.
  const SERIES_AT = { 4: 4, 11: 3, 17: 5 };     // position -> number of images
  let photoId = 0;
  const STREAM = [];
  for (let i = 0; i < 22; i++) {
    const n = SERIES_AT[i] || 1;
    STREAM.push({ images: Array.from({ length: n }, () => ({ id: photoId++, alt: "Placeholder photograph " + photoId })) });
  }
  const urls = [];

  /* ---------- build the wall ---------- */
  const wall = document.getElementById("wall");
  let cells = 0, lastTile = null;
  function photoTile(item, idx) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile";
    const n = item.images.length;
    b.setAttribute("aria-label", n > 1 ? `Series of ${n} photographs, image ${idx + 1}` : "Photograph");
    const im = document.createElement("img");
    im.alt = ""; im.decoding = "async"; im.dataset.id = item.images[idx].id;
    if (urls[im.dataset.id]) im.src = urls[im.dataset.id];
    b.appendChild(im);
    b.addEventListener("click", () => { lastTile = b; openViewer(item, idx); });
    return b;
  }
  function pause() {
    const f = document.createElement("div");
    f.className = "tile tile--pause"; f.setAttribute("aria-hidden", "true");
    return f;
  }
  function buildWall() {
    builtSeriesMode = state.series;
    wall.textContent = "";
    STREAM.forEach((item, i) => {
      const n = item.images.length;
      if (n === 1 || state.series === "tile") { wall.appendChild(photoTile(item, 0)); return; }
      if (i > 0) wall.appendChild(pause());
      item.images.forEach((_, k) => wall.appendChild(photoTile(item, k)));
      if (i < STREAM.length - 1) wall.appendChild(pause());
    });
    cells = wall.children.length;
  }
  const fills = [];
  function layout() {
    const cols = window.innerWidth < 600 ? +state.phone : window.innerWidth < 1000 ? 3 : 4;
    root.style.setProperty("--cols", cols);
    fills.forEach(f => f.remove()); fills.length = 0;
    const rem = cells % cols;
    if (rem) for (let i = 0; i < cols - rem; i++) {
      const f = document.createElement("div");
      f.className = "tile tile--fill"; f.setAttribute("aria-hidden", "true");
      wall.appendChild(f); fills.push(f);
    }
  }
  window.addEventListener("resize", layout);

  (async () => {
    for (let id = 0; id < photoId; id++) {
      urls[id] = await paint(id);
      document.querySelectorAll(`img[data-id="${id}"]`).forEach(im => (im.src = urls[id]));
      if (viewerItem && viewerItem.images[viewerIdx].id === id) renderViewer();
      await new Promise(r => setTimeout(r, 0));
    }
  })();

  /* ---------- viewer ---------- */
  const viewer = document.getElementById("viewer");
  const vImg = document.getElementById("viewerImg");
  let viewerItem = null, viewerIdx = 0;
  function renderViewer() {
    const ph = viewerItem.images[viewerIdx];
    if (urls[ph.id]) vImg.src = urls[ph.id]; else vImg.removeAttribute("src");
    vImg.alt = ph.alt;
    viewer.classList.toggle("is-series", viewerItem.images.length > 1);
  }
  function openViewer(item, idx) {
    viewerItem = item; viewerIdx = idx; renderViewer();
    viewer.hidden = false; document.body.style.overflow = "hidden";
    viewer.focus();
  }
  function closeViewer() {
    viewer.hidden = true; viewerItem = null; document.body.style.overflow = "";
    lastTile && lastTile.focus({ preventScroll: true });
  }
  function step(d) {
    const n = viewerItem.images.length; if (n < 2) return;
    viewerIdx = (viewerIdx + d + n) % n; renderViewer();
  }
  viewer.addEventListener("click", e => {
    if (e.target.closest("#prev")) return step(-1);
    if (e.target.closest("#next")) return step(1);
    closeViewer();
  });
  let tx = 0, ty = 0;
  viewer.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  viewer.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); step(dx < 0 ? 1 : -1); }
    else if (Math.abs(dy) > 80) { e.preventDefault(); closeViewer(); }
  });
  document.addEventListener("keydown", e => {
    if (viewer.hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });

  /* ---------- about ---------- */
  const about = document.getElementById("about");
  const TEXT = {
    en: {
      statement: "Placeholder for the statement. A few quiet sentences on what the photographs are about, in English.",
      bio: "Placeholder for the short biography: born, lives and works in, selected exhibitions.",
      contact: "name@example.com (plain text, not a link)"
    },
    hu: {
      statement: "Helyőrző a bemutatkozó szövegnek. Néhány csendes mondat arról, miről szólnak a képek, magyarul.",
      bio: "Helyőrző a rövid életrajznak: születési hely, hol él és dolgozik, válogatott kiállítások.",
      contact: "nev@pelda.hu (sima szöveg, nem link)"
    }
  };
  let lang = "en";
  function renderAbout() {
    const t = TEXT[lang];
    about.lang = lang;
    document.getElementById("aboutStatement").textContent = t.statement;
    document.getElementById("aboutBio").textContent = t.bio;
    document.getElementById("aboutContact").textContent = t.contact;
    document.getElementById("langEn").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("langHu").setAttribute("aria-pressed", String(lang === "hu"));
  }
  document.getElementById("langEn").addEventListener("click", () => { lang = "en"; renderAbout(); });
  document.getElementById("langHu").addEventListener("click", () => { lang = "hu"; renderAbout(); });
  renderAbout();

  applyState();
})();
</script>
