<title>Kopasz Portfolio Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
/* Layout: an edge-to-edge wall of equal square tiles that dissolves into one
   indigo field. About is not a tile and has no entry: it is simply where the
   wall ends. Bold shapes, humble name. Three shapes only:
   circle = the person, triangle = move, the field = back. */
:root {
  color-scheme: dark;
  --field: #2a1fa8;                 /* indigo */
  --mark: color-mix(in oklab, var(--field), white 24%);
  --mark-strong: color-mix(in oklab, var(--field), white 55%);
  --ink: #f3f2fb;
  --tile-wait: color-mix(in oklab, var(--field), black 35%);
  --cols: 4;
  --ratio: 1 / 1;
  --pad: clamp(14px, 3.5vmin, 44px);
  --zone: clamp(84px, 17vw, 300px);
  --zone-v: 22dvh;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --t-fast: 180ms;
}
html, body { background: var(--field); }
body { color: var(--ink); font-family: var(--body); overflow-x: hidden; }

/* ---------- the wall ---------- */
.wall { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.tile {
  all: unset; display: block; position: relative;
  aspect-ratio: var(--ratio); max-width: 100%;
  background: var(--tile-wait); cursor: zoom-in; overflow: hidden;
}
.tile img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  opacity: 0; transition: opacity 600ms ease;
}
.tile img.ready { opacity: 1; }
.tile:focus-visible { outline: 4px solid var(--mark-strong); outline-offset: -4px; z-index: 1; }
.tile--fill { background: var(--field); cursor: default; pointer-events: none; }

/* ---------- viewer ---------- */
.viewer {
  position: fixed; inset: 0; z-index: 20;
  background: var(--field);
  display: grid; place-items: center;
  cursor: zoom-out;
  animation: lift var(--t-fast) ease-out;
}
.viewer img {
  display: block;
  max-width: calc(100vw - 2 * var(--pad));
  max-height: calc(100dvh - 2 * var(--pad));
  object-fit: contain;
  user-select: none; -webkit-user-drag: none;
}
.viewer.is-series img { max-width: calc(100vw - 2 * var(--zone)); }
.tri {
  all: unset; position: absolute;
  top: var(--pad); bottom: var(--pad);
  width: calc(var(--zone) - 1.5 * var(--pad));
  cursor: pointer; display: none;
}
.viewer.is-series .tri { display: block; }
.tri--prev { left: var(--pad); }
.tri--next { right: var(--pad); }
.tri svg { width: 100%; height: 100%; display: block; }
.tri polygon { fill: var(--mark); transition: fill var(--t-fast); }
.tri:hover polygon, .tri:focus-visible polygon { fill: var(--mark-strong); }
@media (orientation: portrait) {
  /* phone: the photograph runs edge to edge; triangles live below it */
  .viewer img, .viewer.is-series img { max-width: 100vw; max-height: calc(100dvh - 2 * var(--pad)); }
  .viewer.is-series img { max-height: calc(100dvh - var(--zone-v) - var(--pad)); margin-bottom: var(--zone-v); }
  .tri { top: auto; bottom: var(--pad); height: calc(var(--zone-v) - var(--pad)); width: calc(50vw - 1.5 * var(--pad)); }
}
@keyframes lift { from { opacity: 0; } to { opacity: 1; } }

/* ---------- about: where the wall ends ---------- */
.about {
  position: relative;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  overflow: hidden;
}
.about__name {
  margin: 0 0 1.4em;
  font-family: var(--display);
  font-weight: 600; font-stretch: 100%;
  font-size: .95rem; letter-spacing: .04em;
  color: var(--ink);
}
.about__circle {
  all: unset; cursor: pointer;
  display: block; align-self: end;
  width: 62vw; aspect-ratio: 1; max-width: none;
  margin: 0 0 -24vw -20vw;               /* deliberately cropped by the page edge */
}
.about__circle svg { width: 100%; height: 100%; display: block; }
.about__circle circle { fill: var(--mark); transition: fill var(--t-fast); }
.about__circle:hover circle, .about__circle:focus-visible circle { fill: var(--mark-strong); }
.about__circle:focus-visible { outline: none; }
.about__text {
  align-self: end;
  padding: var(--pad);
  padding-right: max(var(--pad), env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--pad) * 2);
  max-width: 36ch;
}
.about p { font-size: clamp(1rem, 1.35vw, 1.25rem); line-height: 1.5; margin: 0 0 1em; font-weight: 380; }
.about .placeholder { opacity: .6; }
.lang { display: flex; gap: .2em; margin-top: 2.2em; margin-left: -.8em; }
.lang button {
  all: unset; cursor: pointer;
  font: 800 .9rem/1 var(--body); font-stretch: 125%; letter-spacing: .08em;
  padding: .6em .8em; color: var(--ink); opacity: .45;
}
.lang button[aria-pressed="true"] { opacity: 1; }
.lang button:focus-visible { outline: 2px solid var(--mark-strong); }
@media (max-width: 700px) {
  .about { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .about__text { grid-row: 1; padding-top: calc(var(--pad) * 3); padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); }
  .about__circle { grid-row: 2; width: 120vw; margin: 6vw 0 -60vw -10vw; }
}

/* ---------- prototype controls (not part of the site) ---------- */
.proto {
  position: fixed; z-index: 40;
  right: calc(12px + env(safe-area-inset-right, 0px));
  top: calc(12px + env(safe-area-inset-top, 0px));
  font: 500 12px/1.3 var(--body); color: #111;
  display: flex; flex-direction: column; align-items: flex-end;
}
.proto__toggle {
  all: unset; cursor: pointer; background: #fff; color: #111;
  padding: 8px 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; font-size: 11px;
  box-shadow: 0 4px 18px rgb(0 0 0 / .35);
}
.proto__toggle:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
.proto__panel {
  order: 2; background: #fff; padding: 14px; margin-top: 8px; width: min(280px, calc(100vw - 24px));
  display: grid; gap: 12px; box-shadow: 0 8px 30px rgb(0 0 0 / .4);
  max-height: calc(100dvh - 80px); overflow-y: auto;
}
.proto__panel p { margin: 0; color: #555; }
.proto fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.proto legend { font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; color: #444; margin-bottom: 4px; }
.proto .opts { display: flex; flex-wrap: wrap; gap: 4px; }
.proto .opts button { all: unset; cursor: pointer; padding: 5px 8px; border: 1px solid #ccc; color: #111; }
.proto .opts button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
.proto .opts button:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
.swatch { width: 10px; height: 10px; display: inline-block; vertical-align: -1px; margin-right: 5px; }

@media (prefers-reduced-motion: reduce) {
  .viewer { animation: none; }
  .tile img { transition: none; }
}
</style>

<main id="top">
  <div class="wall" id="wall" aria-label="Photographs"></div>

  <section class="about" id="about" aria-labelledby="aboutName">
    <button class="about__circle" id="aboutBack" aria-label="Back to the first photograph">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50"/></svg>
    </button>
    <div class="about__text">
      <h1 class="about__name" id="aboutName"></h1>
      <p class="placeholder" id="aboutBio"></p>
      <p class="placeholder" id="aboutContact"></p>
      <div class="lang" role="group" aria-label="Language">
        <button id="langEn" aria-pressed="true" lang="en">EN</button>
        <button id="langHu" aria-pressed="false" lang="hu">HU</button>
      </div>
    </div>
  </section>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photograph">
  <img id="viewerImg" alt="">
  <button class="tri tri--prev" id="prev" aria-label="Previous photograph in series">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="100,0 100,100 0,50"/></svg>
  </button>
  <button class="tri tri--next" id="next" aria-label="Next photograph in series">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 0,100 100,50"/></svg>
  </button>
</div>

<div class="proto" id="proto">
  <button class="proto__toggle" id="protoToggle" aria-expanded="false" aria-controls="protoPanel">Prototype</button>
  <div class="proto__panel" id="protoPanel" hidden>
    <p>Prototype controls, not part of the site. Placeholder images are generated; your photographs replace them. Defaults are your choices: indigo, square, 4 columns, 2 on phones, toned marks.</p>
    <fieldset><legend>Phone columns</legend><div class="opts" data-key="phone"></div></fieldset>
    <fieldset><legend>Marks</legend><div class="opts" data-key="mark"></div></fieldset>
    <fieldset><legend>Field colour</legend><div class="opts" data-key="field"></div></fieldset>
  </div>
</div>

<script>
(() => {
  /* ---------- prototype options ---------- */
  const OPTIONS = {
    phone: [["1", "1"], ["2", "2"], ["3", "3"]],
    mark: [["Tone", "tone"], ["Black", "black"], ["White", "white"]],
    field: [["Indigo", "#2a1fa8"], ["Deep indigo", "#1d1580"], ["Klein blue", "#002fa7"], ["Ocean", "#005f8f"]]
  };
  const DEFAULTS = { phone: "2", mark: "tone", field: "#2a1fa8" };
  let state = { ...DEFAULTS };
  try { Object.assign(state, JSON.parse(localStorage.getItem("proto-v3") || "{}")); } catch (e) {}

  const root = document.documentElement;
  function applyState() {
    root.style.setProperty("--field", state.field);
    const m = state.mark;
    root.style.setProperty("--mark", m === "black" ? "#0a0a0c" : m === "white" ? "#f4f4f6" : "color-mix(in oklab, var(--field), white 24%)");
    root.style.setProperty("--mark-strong", m === "black" ? "#000" : m === "white" ? "#fff" : "color-mix(in oklab, var(--field), white 55%)");
    layout();
    document.querySelectorAll(".proto .opts").forEach(g => {
      g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.value === state[g.dataset.key])));
    });
    try { localStorage.setItem("proto-v3", JSON.stringify(state)); } catch (e) {}
  }
  document.querySelectorAll(".proto .opts").forEach(g => {
    OPTIONS[g.dataset.key].forEach(([label, value]) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.value = value;
      b.innerHTML = (g.dataset.key === "field" ? `<span class="swatch" style="background:${value}"></span>` : "") + label;
      b.addEventListener("click", () => { state[g.dataset.key] = value; applyState(); });
      g.appendChild(b);
    });
  });
  const protoToggle = document.getElementById("protoToggle");
  const protoPanel = document.getElementById("protoPanel");
  protoToggle.addEventListener("click", () => {
    protoPanel.hidden = !protoPanel.hidden;
    protoToggle.setAttribute("aria-expanded", String(!protoPanel.hidden));
  });

  /* ---------- placeholder photographs (procedural landscapes) ---------- */
  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const PALETTES = [
    ["#9fb3c2", "#e6e1d6", "#5d6b70", "#20282b"],
    ["#2b3446", "#c98f62", "#3a2e2e", "#120e10"],
    ["#7e9a8e", "#d8dccf", "#47584c", "#18211a"],
    ["#c9c3b8", "#f1ece4", "#8b8478", "#2f2b26"],
    ["#0f1b2c", "#4e6a86", "#16202a", "#05080b"],
    ["#b6533a", "#e8b27d", "#5a2a1f", "#1d0e0a"]
  ];
  const RATIOS = [3/2, 2/3, 4/5, 1, 16/9, 5/4, 3/4];
  const mix = (a, b, t) => {
    const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`;
  };
  function paint(seed) {
    const r = rng(seed * 9973 + 17);
    const ratio = RATIOS[Math.floor(r() * RATIOS.length)];
    const long = 1100;
    const w = ratio >= 1 ? long : Math.round(long * ratio);
    const h = ratio >= 1 ? Math.round(long / ratio) : long;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d");
    const pal = PALETTES[Math.floor(r() * PALETTES.length)];
    const mono = r() < 0.45;
    const horizon = h * (0.3 + r() * 0.45);
    let g = x.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    if (r() < 0.35) {
      const sx = w * (0.2 + r() * 0.6), sy = horizon * (0.5 + r() * 0.4), sr = Math.min(w, h) * (0.04 + r() * 0.08);
      const sg = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
      sg.addColorStop(0, "rgba(255,248,235,.95)"); sg.addColorStop(0.25, "rgba(255,240,220,.35)"); sg.addColorStop(1, "rgba(255,240,220,0)");
      x.fillStyle = sg; x.fillRect(0, 0, w, h);
    }
    const water = r() < 0.3;
    const layers = 2 + Math.floor(r() * 3);
    for (let L = 0; L < layers; L++) {
      const t = L / (layers - 1);
      const base = horizon + (water ? 0 : (h - horizon) * t * 0.55);
      const amp = h * (0.03 + r() * 0.09) * (1 - t * 0.5);
      const f1 = 1 + r() * 3, f2 = 4 + r() * 9, ph = r() * 10;
      x.beginPath(); x.moveTo(0, h);
      for (let px = 0; px <= w; px += 4) {
        const u = px / w;
        x.lineTo(px, base - amp * (0.6 * Math.sin(u * f1 * Math.PI + ph) + 0.3 * Math.sin(u * f2 * Math.PI + ph * 2) + 0.1 * Math.sin(u * 40 + L)));
      }
      x.lineTo(w, h); x.closePath();
      x.fillStyle = mix(pal[2], pal[3], t); x.fill();
      if (water) break;
    }
    if (water) {
      g = x.createLinearGradient(0, horizon, 0, h);
      g.addColorStop(0, pal[1]); g.addColorStop(1, pal[3]);
      x.fillStyle = g; x.fillRect(0, horizon + h * 0.01, w, h);
    }
    const fogY = horizon + (r() - 0.5) * h * 0.1, fogH = h * (0.08 + r() * 0.2);
    g = x.createLinearGradient(0, fogY - fogH, 0, fogY + fogH);
    g.addColorStop(0, "rgba(235,235,230,0)"); g.addColorStop(0.5, `rgba(235,235,230,${0.15 + r() * 0.45})`); g.addColorStop(1, "rgba(235,235,230,0)");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    const img = x.getImageData(0, 0, w, h), d = img.data, amt = 14 + r() * 20;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * amt;
      let R = d[i] + n, G = d[i + 1] + n, B = d[i + 2] + n;
      if (mono) { let l = 0.3 * R + 0.59 * G + 0.11 * B; l = 128 + (l - 128) * 1.35; R = G = B = l; }
      d[i] = R; d[i + 1] = G; d[i + 2] = B;
    }
    x.putImageData(img, 0, 0);
    const v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.45)");
    x.fillStyle = v; x.fillRect(0, 0, w, h);
    return new Promise(res => c.toBlob(b => res(URL.createObjectURL(b)), "image/jpeg", 0.86));
  }

  /* ---------- content: singles and series ---------- */
  // In the real site this comes from a data file (src/content/stream.yaml).
  const SERIES_AT = { 2: 4, 7: 3, 12: 5, 18: 3 };
  let photoId = 0;
  const STREAM = [];
  for (let i = 0; i < 26; i++) {
    const n = SERIES_AT[i] || 1;
    STREAM.push({ images: Array.from({ length: n }, () => ({ id: photoId++, alt: "Placeholder landscape " + photoId })) });
  }
  const urls = [];

  /* ---------- build the wall ---------- */
  const wall = document.getElementById("wall");
  let lastTile = null;
  STREAM.forEach(item => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile";
    b.setAttribute("aria-label", item.images.length > 1 ? `Series of ${item.images.length} photographs` : "Photograph");
    const im = document.createElement("img");
    im.alt = ""; im.decoding = "async";
    item.tileImg = im; b.appendChild(im);
    b.addEventListener("click", () => { lastTile = b; openViewer(item); });
    wall.appendChild(b);
  });
  const fills = [];
  function layout() {
    const cols = window.innerWidth < 600 ? +state.phone : window.innerWidth < 1000 ? 3 : 4;
    root.style.setProperty("--cols", cols);
    fills.forEach(f => f.remove()); fills.length = 0;
    const rem = STREAM.length % cols;
    if (rem) for (let i = 0; i < cols - rem; i++) {
      const f = document.createElement("div");
      f.className = "tile tile--fill"; f.setAttribute("aria-hidden", "true");
      wall.appendChild(f); fills.push(f);
    }
  }
  window.addEventListener("resize", layout);

  (async () => {
    for (let id = 0; id < photoId; id++) {
      urls[id] = await paint(id);
      STREAM.forEach(item => {
        if (item.images[0].id === id) {
          item.tileImg.onload = () => item.tileImg.classList.add("ready");
          item.tileImg.src = urls[id];
        }
      });
      if (viewerItem && viewerItem.images[viewerIdx].id === id) renderViewer();
      await new Promise(r => setTimeout(r, 0));
    }
  })();

  /* ---------- viewer ---------- */
  const viewer = document.getElementById("viewer");
  const vImg = document.getElementById("viewerImg");
  let viewerItem = null, viewerIdx = 0;
  function renderViewer() {
    const ph = viewerItem.images[viewerIdx];
    if (urls[ph.id]) vImg.src = urls[ph.id];
    vImg.alt = ph.alt;
    viewer.classList.toggle("is-series", viewerItem.images.length > 1);
  }
  function openViewer(item) {
    viewerItem = item; viewerIdx = 0; renderViewer();
    viewer.hidden = false; document.body.style.overflow = "hidden";
    viewer.tabIndex = -1;
    (item.images.length > 1 ? document.getElementById("next") : viewer).focus();
  }
  function closeViewer() {
    viewer.hidden = true; viewerItem = null; document.body.style.overflow = "";
    lastTile && lastTile.focus({ preventScroll: true });
  }
  function step(d) {
    const n = viewerItem.images.length; if (n < 2) return;
    viewerIdx = (viewerIdx + d + n) % n; renderViewer();
  }
  viewer.addEventListener("click", e => {
    if (e.target.closest("#prev")) return step(-1);
    if (e.target.closest("#next")) return step(1);
    closeViewer();
  });
  let tx = 0, ty = 0;
  viewer.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  viewer.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); step(dx < 0 ? 1 : -1); }
    else if (Math.abs(dy) > 80) { e.preventDefault(); closeViewer(); }
  });

  /* ---------- about: the end of the wall ---------- */
  const about = document.getElementById("about");
  const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  document.getElementById("aboutBack").addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: smooth });
    const first = wall.querySelector(".tile"); first && first.focus({ preventScroll: true });
  });

  const TEXT = {
    en: { name: "Kopasz Márton", bio: "Placeholder. Your statement and short biography go here, in English.", contact: "Placeholder. Contact email and links go here." },
    hu: { name: "Kopasz Márton", bio: "Helyőrző. Ide kerül a bemutatkozás és a rövid életrajz, magyarul.", contact: "Helyőrző. Ide kerül az e-mail-cím és az elérhetőségek." }
  };
  let lang = "en";
  function renderAbout() {
    const t = TEXT[lang];
    about.lang = lang;
    document.getElementById("aboutName").textContent = t.name;
    document.getElementById("aboutBio").textContent = t.bio;
    document.getElementById("aboutContact").textContent = t.contact;
    document.getElementById("langEn").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("langHu").setAttribute("aria-pressed", String(lang === "hu"));
  }
  document.getElementById("langEn").addEventListener("click", () => { lang = "en"; renderAbout(); });
  document.getElementById("langHu").addEventListener("click", () => { lang = "hu"; renderAbout(); });
  renderAbout();

  document.addEventListener("keydown", e => {
    if (viewer.hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });

  applyState();
})();
</script>
